<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="src/style.css" />
    <title>Project Weather App</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form class="search-form" id="search-form">
          <input
            type="search"
            placeholder="Search for a city..."
            required
            id="search-form-input"
            class="search-form-input"
          />
          <input type="submit" value="Search" class="search-form-button" />
        </form>
      </header>

      <main>
        <div class="weather-app-data">
          <div>
            <h1 class="weather-app-city" id="city">London</h1>
            <p class="weather-app-details">
              Tuesday 14:49, scattered clouds
              <br />
              Humidity: <strong>82%</strong> | Wind: <strong>4.1</strong> km/h
            </p>
          </div>

          <div class="weather-app-temperature-container">
            <div class="weather-app-icon">🌥️</div>
            <div class="weather-app-temperature">12</div>
            <div class="weather-app-temperature-unit">°C</div>
          </div>
        </div>
      </main>
      <footer>
        This project was coded by
        <a href="https://github.com/debbiehunter" target="_blank"
          >Debbie Hunter</a
        >
        and is open sourced on
        <a
          href="https://github.com/debahunter821-ux/Project-Weather-App"
          target="blank"
          >GitHub</a
        >
        and is hosted on
        <a href="https://debs-project-weather-app.netlify.app/" target="_blank"
          >Netlify</a
        >.
      </footer>
    </div>
    <script src="src/index.js"></script>
  </body>
</html>
